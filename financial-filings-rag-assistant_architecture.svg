<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Architecture of the governed financial filings RAG</title>
<desc>An ingest lane chunks and embeds filings into a Chroma index; a query pipeline guards, retrieves, reranks, generates a cited answer and redacts PII; a RAGAS evaluation gate runs in CI.</desc>
<style>
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- ingest lane -->
<rect x="50" y="50" width="130" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="115" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Filings</text><text class="ts" x="115" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">.txt · EDGAR</text>
<rect x="200" y="50" width="130" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="265" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Chunk</text><text class="ts" x="265" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">overlap split</text>
<rect x="350" y="50" width="130" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="415" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Embed</text><text class="ts" x="415" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">MiniLM</text>
<rect x="500" y="50" width="130" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="565" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Chroma</text><text class="ts" x="565" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">vector index</text>
<line x1="180" y1="74" x2="200" y2="74" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="74" x2="350" y2="74" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="74" x2="500" y2="74" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M565 98 L565 120 L212 120 L212 148" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="388" y="114" text-anchor="middle" fill="#6f6e69">index</text>
<!-- query entry -->
<rect x="34" y="98" width="112" height="34" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="90" y="115" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">User query</text>
<line x1="90" y1="132" x2="90" y2="148" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- query pipeline -->
<rect x="34" y="150" width="112" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="90" y="170" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Input guard</text><text class="ts" x="90" y="188" text-anchor="middle" dominant-baseline="central" fill="#534AB7">injection check</text>
<rect x="156" y="150" width="112" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="212" y="170" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Retrieve</text><text class="ts" x="212" y="188" text-anchor="middle" dominant-baseline="central" fill="#534AB7">top-k</text>
<rect x="278" y="150" width="112" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="334" y="170" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Rerank</text><text class="ts" x="334" y="188" text-anchor="middle" dominant-baseline="central" fill="#534AB7">cross-encoder</text>
<rect x="400" y="150" width="112" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="456" y="170" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Generate</text><text class="ts" x="456" y="188" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Claude · cited</text>
<rect x="522" y="150" width="112" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="578" y="170" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Answer</text><text class="ts" x="578" y="188" text-anchor="middle" dominant-baseline="central" fill="#534AB7">PII-redacted</text>
<line x1="146" y1="177" x2="156" y2="177" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="268" y1="177" x2="278" y2="177" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390" y1="177" x2="400" y2="177" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="512" y1="177" x2="522" y2="177" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- eval -->
<path d="M578 204 L578 226 L340 226 L340 248" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="360" y="220" text-anchor="start" fill="#6f6e69">evaluated by</text>
<rect x="90" y="250" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="165" y="270" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Test set</text><text class="ts" x="165" y="288" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">labeled Q&amp;A</text>
<rect x="265" y="250" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="340" y="270" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">RAGAS</text><text class="ts" x="340" y="288" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">4 metrics</text>
<rect x="440" y="250" width="150" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="515" y="270" text-anchor="middle" dominant-baseline="central" fill="#633806">Quality gate</text><text class="ts" x="515" y="288" text-anchor="middle" dominant-baseline="central" fill="#854F0B">pytest CI</text>
<line x1="240" y1="276" x2="265" y2="276" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="415" y1="276" x2="440" y2="276" stroke="#8a8984" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="330" text-anchor="middle" fill="#6f6e69">Teal: ingest   Purple: query pipeline   Gray: evaluation   Amber: CI gate</text>
</svg>
